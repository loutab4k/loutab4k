name: Update profile

on:
  push:
    branches: [main]
    paths:
      - assets/portrait-ascii.png
      - profile.json
      - scripts/generate_profile.py
      - .github/workflows/profile.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile.py
      - name: Commit updated cards
        run: |
          if git diff --quiet -- profile-dark.svg profile-light.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-dark.svg profile-light.svg
          git commit -m "chore: update profile stats"
          git push
